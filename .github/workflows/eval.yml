name: eval-marksix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cast one chart (example birth)
        run: python src/cast_one.py 1988 2 8 4

      - name: Run eval (sample + last 100 draws)
        run: python src/eval_marksix.py --n 100 --sample 2026-08-22

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-log
          path: requirements.txt
