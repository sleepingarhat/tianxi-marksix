name: eval-marksix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dayun 1988-02-08 male Yin hour
        run: python src/dayun.py 1988 2 8 4 male

      - name: Cast one chart
        run: python src/cast_one.py 1988 2 8 4

      - name: Run eval (last 100)
        run: python src/eval_marksix.py --n 100 --sample 2026-08-22
