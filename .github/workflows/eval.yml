name: eval-marksix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tianxi dayun + geju
        run: python tests/test_dayun_geju.py
      - name: Mingpan sample
        run: python src/tianxi_engine.py --birth 1988-02-08T04:00 --sex male --at 2026-08-22T21:30
      - name: Qimen pure sample (chaibu-v3)
        run: python src/personal_x_draw_qimen.py --draw 2026-08-22
      - name: Qimen personal sample
        run: python src/personal_x_draw_qimen.py --personal 1988-02-08T04:00 --draw 2026-08-22
      - name: Two-group 100-period
        run: python src/eval_two_groups.py --personal 1988-02-08T04:00 --n 100
