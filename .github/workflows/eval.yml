name: eval-marksix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Bazi personal x draw
        run: python src/personal_x_draw_bazi.py --personal 1988-02-08T04:00 --draw 2026-08-22
      - name: Qimen personal x draw
        run: python src/personal_x_draw_qimen.py --personal 1988-02-08T04:00 --draw 2026-08-22
